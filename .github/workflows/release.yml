name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag to release (e.g. v0.1.0). Leave empty to use commit SHA"
        required: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version_tag || github.ref_name }}
          releaseName: "UNICREW ${{ github.event.inputs.version_tag || github.ref_name }}"
          releaseBody: |
            ## UNICREW デスクトップアプリ

            **インストール手順 (Windows)**:
            1. 下の Assets から `UNICREW_x.y.z_x64-setup.exe` をダウンロード
            2. ダブルクリックで実行（SmartScreen警告が出たら「詳細情報」→「実行」）
            3. デスクトップに UNICREW アイコンが追加される

            **必要環境**:
            - Windows 10 / 11 (x64)
            - Claude Code CLI または Codex CLI（アプリ内設定からインストール可）

            ---
            🤖 Auto-generated by tauri-action
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
