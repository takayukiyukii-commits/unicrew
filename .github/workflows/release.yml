name: release

# UNICREW のクロスプラットフォーム ビルド & GitHub Release ドラフト作成。
#
# トリガ:
#   - `vX.Y.Z` 形式のタグを push したとき
#   - 手動実行（workflow_dispatch）
#
# 出力（GitHub Release のドラフトに自動添付）:
#   - Windows : .msi / -setup.exe + 各 .sig + latest.json
#   - macOS   : universal .dmg + .app.tar.gz + 各 .sig （Apple Silicon / Intel 両対応 universal バイナリ）
#   - Linux   : .AppImage / .deb （ベストエフォート、失敗してもリリースを止めない）
#
# 必要な GitHub Secrets:
#   - TAURI_SIGNING_PRIVATE_KEY            ... minisign 秘密鍵の本文
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD   ... 同パスフレーズ
#   詳細は .github/RELEASE_SETUP.md を参照

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag to release (e.g. v0.2.3). Leave empty to use commit SHA"
        required: false

# 同じタグの多重実行をブロック
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 🚨 ドラフトのリリースは「1回だけ」作る。
  #
  # 以前は 3 つの build ジョブがそれぞれ tauri-action にタグ名を渡しており、同時に起動した
  # 3 つが「まだ無いから作る」を同時に判断して、**同じタグのドラフトが 2 つ**できた。
  # 配布物は Linux 側と Windows/macOS 側に分裂し、latest.json も別々になった
  # （2026-09-19 v0.5.2 で実際に発生。7 個と 8 個に割れ、手で統合した）。
  # ジョブはどれも "success" を返すので、CI の結果からは気づけない。
  #
  # ここで作った 1 つの release_id を全ジョブに配り、tauri-action には releaseId だけを渡す。
  # 既に同じタグのドラフトがあればそれを使い回す（再実行しても増やさない）。
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name == \"$TAG\")] | first | .id // empty")
          if [ -n "$existing" ]; then
            echo "既存のリリースを使う: id=$existing"
            echo "release_id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(cat .github/release-body.md)"
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="UNICREW $TAG" -F draft=true -F prerelease=false -f body="$body" --jq .id)
          echo "新しくドラフトを作った: id=$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 一時的に 3OS 再有効化（macOS install 修正の検証/配布のため）。
          #    macOS は ×10 課金。検証後は Windows のみへ戻すか、5/21 の
          #    public 化（Actions 無料）以降に常時 3OS へ。
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            label: "macOS (universal)"
            allow-failure: false
          - platform: "windows-latest"
            args: ""
            rust-targets: ""
            label: "Windows"
            allow-failure: false
          - platform: "ubuntu-22.04"
            args: ""
            rust-targets: ""
            label: "Linux"
            allow-failure: true
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.allow-failure }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Rust stable + macOS は universal バイナリ用に両アーキ追加
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      # Linux ビルドに必要な webkit2gtk / appindicator / rsvg などを導入。
      # Tauri v2 公式 prerequisites（Ubuntu 22.04）に合わせて Ayatana 系のみに統一。
      # 旧 libappindicator3-dev と libayatana-appindicator3-dev は Conflicts するので併用不可。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file

      - name: Install frontend dependencies
        run: npm ci

      # Windows コード署名（Azure Trusted Signing）の道具立て。
      # scripts/sign-windows.mjs が signtool(x64) + Azure.CodeSigning.Dlib を
      # %TRUSTED_SIGNING_DIR% から解決する。metadata.json はスクリプトが自動生成。
      # Secrets（AZURE_*）が無い fork 等ではスクリプト側が警告して未署名で続行する。
      - name: Setup Trusted Signing tools (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\TrustedSigning"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # バージョンはローカル実証済みのものに固定（監査指摘・供給網対策。更新は明示的コミットで）
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -OutputDirectory $dir -x
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.4188 -OutputDirectory $dir -x
          echo "TRUSTED_SIGNING_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri Updater 用 minisign 署名（Ed25519）。両 OS 共通。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows Authenticode（Azure Trusted Signing / zuboland-prod 共用プロファイル）。
          # bundle.windows.signCommand → scripts/sign-windows.mjs がこの 3 変数で認証する。
          # updater の minisign 署名は「Authenticode 済み exe」に対して行われるため、
          # 署名をローカル差し替えにすると sig 不一致で自動更新が壊れる＝必ず CI 内で署名する。
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # スマホ連携クラウドリレー（Supabase Realtime broadcast）用。
          # build_tauri.js → next build がこの env を static export に焼き込み、
          # 配布バイナリで isCloudConfigured()=true（「QRですぐ使う」が実働）になる。
          # publishable キーは公開前提設計だが、public 化予定リポにソースで載せ
          # ないため値は GitHub Secrets に置き、ビルド時のみ注入する。
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # ── 以下は Apple Developer Program に加入後、コード署名 + notarization する時に有効化:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                # base64(.p12)
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}      # "Developer ID Application: <Name> (<TeamID>)"
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                      # App-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # 🚨 タグ名ではなく release_id を渡す。タグ名を渡すと各ジョブが自分で作りにいき、
          #    同じタグのドラフトが複数できる（本ファイル冒頭 create-release の説明を参照）。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # リリース作成がアカウント課金状態で 403 になっても、ビルド済みの
      # インストーラを Actions Artifacts として取り出せるようにする
      # （Releases API を使わない＝支払い失敗状態でも DL 可能）。
      - name: Upload installers as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicrew-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: ignore
          retention-days: 7
