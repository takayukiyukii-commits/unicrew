# 検査CI（2026-08-23 設計品質調査で新設）
#   目的: Windowsローカルでは通るが Linux(Vercel) でだけ落ちる事故（import の大文字小文字など）を
#         人力監査の前に機械で拾う。型チェックは必須。lint は既存負債がある間は「見えるが止めない」。
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --ignore-scripts
      # Next 16 は RouteContext/PageProps 等の型を .next/types に生成する。ローカルは .next があるので通るが
      # CI には無い → 先に生成しないと「ローカルだけ通る」型エラーになる（2026-08-23 uniLinks で実測）
      - name: next typegen
        run: npx next typegen
      - name: typecheck (必須)
        run: npx tsc --noEmit -p tsconfig.json
      - name: lint (必須)
        run: npm run lint --silent
      - name: test (必須)
        run: npm test --silent
      # 版数の一元化（v0.4.0）: package.json / Cargo.toml / tauri.conf.json / Cargo.lock / whatsnew fallback /
      # public/whatsnew/<version>.md の一致。5版ぶん告知が止まっていた事故（2026-09-03）の再発防止
      - name: version sync (必須)
        run: python3 scripts/verify_version_sync.py --selftest && python3 scripts/verify_version_sync.py

