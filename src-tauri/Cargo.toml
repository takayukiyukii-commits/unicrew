[package]
name = "unicrew"
version = "0.1.0"
description = "UNICREW - AIを動かすことに特化したマルチAIデスクトップ。"
authors = ["uniLinks / ZUBOLAND"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "unicrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.1"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
base64 = "0.22"
toml = "0.8"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
async-trait = "0.1"
thiserror = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
