[package]
name = "unicrew"
version = "0.2.29"
description = "UNICREW - AIを動かすことに特化したマルチAIデスクトップ。"
authors = ["uniLinks / ZUBOLAND"]
edition = "2021"
# 2026-05-10 Sprint 1 で 1.77 → 1.91.1 に引き上げ。
# 理由: agent-client-protocol crate を取り込むため goose workspace の MSRV に合わせる。
rust-version = "1.91.1"

[lib]
name = "unicrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.1"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
# UNICREW 本体のアップデート（Ed25519 署名済 latest.json を GitHub Releases から取得して
# msi/nsis インストーラを差し替える）。署名鍵は D:\secrets\tauri-signing\ にあり、
# ビルド時に TAURI_SIGNING_PRIVATE_KEY 経由で読み込まれる。
tauri-plugin-updater = "2.0"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1.0"
base64 = "0.22"
toml = "0.8"
dirs = "5.0"
# reqwest 0.13: rustls-tls フィーチャーは "rustls" + "rustls-native-certs" に分割された（2026-05-10 移行）
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "multipart", "json"] }
async-trait = "0.1"
thiserror = "2.0"

# 業界標準 ACP（Agent Client Protocol）— Zed 主導のオープンプロトコル。
# Goose / OpenCode / Codex-acp / Kiro 等の ACP 対応 agent と型付き JSON-RPC で通信する。
# Sprint 1（2026-05-13）追加。providers/acp_transport.rs と providers/goose.rs から使用。
agent-client-protocol = "0.11"

# 対話モード PTY（VSCode 統合ターミナルと同じく本物の対話 CLI を擬似端末で動かす）。
# ハイブリッド方針 B の土台。providers/ とは独立。
portable-pty = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
